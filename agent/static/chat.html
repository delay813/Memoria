<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心忆 · Memoria</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<div class="petals" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="app-container">
    <!-- 左侧导航 -->
    <aside class="sidebar">
        <div class="brand">心忆 · Memoria</div>
        <div class="char-label">角色</div>
        <div class="character-switcher" id="switcher"></div>
        <div class="sidebar-foot">
            <div class="world-date" id="worldDate">—</div>
            <div class="world-time" id="worldTime">—</div>
            <div class="world-day" id="worldDay">—</div>
            <div class="world-tags" id="worldTags"></div>
            <div class="life-title" id="lifeTitle">世界动态</div>
            <div class="life-feed" id="lifeFeed"></div>
            <div class="nickname-row">
                <input class="nickname-input" id="nicknameInput" placeholder="你的昵称（她会这样叫你）" maxlength="20">
                <button class="nickname-save" id="nicknameSave">保存</button>
            </div>
            <button class="sidebar-icon-btn" id="notifyBtn"><i class="bi bi-bell"></i>桌面通知</button>
            <button class="sidebar-icon-btn" id="achieveBtn"><i class="bi bi-trophy"></i>成就图鉴</button>
            <button class="reset-btn" id="resetBtn"><i class="bi bi-arrow-counterclockwise"></i>初始化所有角色</button>
        </div>
    </aside>

    <!-- 中间主舞台 -->
    <main class="main-stage">
        <div class="stage-background" id="stageBg"><img id="bgImg" src="" alt=""></div>
        <div class="stage-overlay"></div>
        <div class="stage-content">
            <!-- 聊天面板 -->
            <div class="chat-panel">
                <div class="chat-header">
                    <div class="chat-title"><span class="dot"></span><span id="chatTitle">—</span></div>
                    <div class="chat-favor">
                        <button class="toggle-btn on" id="thoughtToggle" title="显示 / 隐藏角色的内心独白"><i class="bi bi-chat-square-heart"></i>心声</button>
                        <span id="chatFavorText">—</span>
                        <div class="favor-bar"><i id="chatFavorBar" style="width:0%"></i></div>
                    </div>
                </div>
                <div class="messages-container" id="messages"></div>
                <button class="scroll-bottom-btn" id="scrollBottomBtn" title="回到底部" aria-label="回到底部"><i class="bi bi-chevron-down"></i></button>
                <div class="input-area">
                    <div class="quick-row" id="topicRow"></div>
                    <div class="input-wrapper">
                        <input id="input" placeholder="说点什么…（Enter 发送）" autofocus>
                        <button class="send-btn" id="sendBtn" title="发送" aria-label="发送"><i class="bi bi-send-fill"></i></button>
                    </div>
                </div>
            </div>

            <!-- 右侧角色卡 -->
            <div class="character-panel">
                <div class="character-card">
                    <div class="character-image-wrap"><img id="cardImg" src="" alt="角色立绘"></div>
                    <div class="character-names">
                        <h2 id="cardName">—</h2>
                        <p id="cardEn">—</p>
                        <p class="card-status" id="cardStatus">—</p>
                    </div>
                    <div class="character-tags" id="cardTags"></div>
                    <p class="character-desc" id="cardDesc">—</p>
                    <div class="favor-card">
                        <div class="row"><span class="label">好感度</span><span class="value" id="cardFavorValue">—</span></div>
                        <div class="bar"><i id="cardFavorBar" style="width:0%"></i></div>
                    </div>
                    <div class="schedule-card">
                        <div class="schedule-title">今日行程</div>
                        <div class="schedule-list" id="scheduleList"></div>
                    </div>
                    <div class="quote-box" id="cardQuote">—</div>
                    <button class="diary-btn" id="diaryBtn"><i class="bi bi-journal-bookmark"></i>回忆日记</button>
                    <button class="memory-btn" id="memoryBtn"><i class="bi bi-heart"></i>她眼中的你</button>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 回忆日记弹窗 -->
<div class="diary-modal" id="diaryModal">
    <div class="diary-panel">
        <button class="diary-close" id="diaryClose" aria-label="关闭"><i class="bi bi-x-lg"></i></button>
        <h3 id="diaryTitle">回忆日记</h3>
        <div class="diary-sub" id="diarySub">—</div>
        <div id="diaryBody"></div>
    </div>
</div>

<!-- 她眼中的你 · 记忆卡弹窗 -->
<div class="diary-modal" id="memoryModal">
    <div class="diary-panel">
        <button class="diary-close" id="memoryClose" aria-label="关闭"><i class="bi bi-x-lg"></i></button>
        <h3 id="memoryTitle">她眼中的你</h3>
        <div class="diary-sub" id="memorySub">—</div>
        <div id="memoryBody"></div>
    </div>
</div>

<!-- 成就图鉴弹窗 -->
<div class="diary-modal" id="achieveModal">
    <div class="diary-panel">
        <button class="diary-close" id="achieveClose" aria-label="关闭"><i class="bi bi-x-lg"></i></button>
        <h3>🎖 成就图鉴</h3>
        <div class="diary-sub">记录你和角色的每一个特别时刻</div>
        <div class="achievement-grid" id="achieveGrid"></div>
    </div>
</div>

<!-- 顶部浮动提示 -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
(function () {
    // 角色视觉资料(头像/卡面/英文名/标签/语录/主题色)已由后端 /agents 返回, 前端不再硬编码
    // 主动消息 kind → 展示标签
    var PROACTIVE_LABELS = { festival: '节日问候', checkin: '想念', reply: '延迟回复', milestone: '关系里程碑', reconcile: '和好' };

    var state = { agents: [], currentId: null, conversations: {}, world: null, streaming: false, unread: {}, showThought: true, notify: false, topics: [], topicAgent: null, topicIdx: 0, topicLoadedAt: 0, achievements: [], knownAchievements: {} };

    var $ = function (id) { return document.getElementById(id); };
    var messagesBox = $('messages'), switcher = $('switcher'), input = $('input'), sendBtn = $('sendBtn');
    var diaryBtn = $('diaryBtn'), diaryModal = $('diaryModal'), diaryBody = $('diaryBody');
    var memoryBtn = $('memoryBtn'), memoryModal = $('memoryModal'), memoryBody = $('memoryBody');
    var thoughtToggle = $('thoughtToggle'), toastWrap = $('toastWrap');
    var topicRow = $('topicRow');
    var achieveBtn = $('achieveBtn'), achieveModal = $('achieveModal'), achieveGrid = $('achieveGrid');
    var notifyBtn = $('notifyBtn'), nicknameInput = $('nicknameInput'), nicknameSave = $('nicknameSave');
    var scrollBottomBtn = $('scrollBottomBtn');

    function api(url, opts) {
        return fetch(url, opts).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        });
    }

    function vis(id) {
        for (var i = 0; i < state.agents.length; i++) {
            if (state.agents[i].id === id) return state.agents[i];
        }
        return { avatar: '', card: '', en: '', tags: [], quote: '', theme: null };
    }
    var DEFAULT_THEME = { sidebar: '#0f1429', primary: '#5b7cff', soft: '#8aa4ff', accent: '#b794f6', user: 'linear-gradient(135deg,#5b7cff,#7c6dfc)' };
    function theme(id) { var v = vis(id); return (v && v.theme) ? v.theme : DEFAULT_THEME; }
    function curAgent() {
        for (var i = 0; i < state.agents.length; i++) if (state.agents[i].id === state.currentId) return state.agents[i];
        return null;
    }
    function favorStage(f) {
        if (f < 20) return '陌生'; if (f < 45) return '熟悉'; if (f < 70) return '亲近'; return '亲密';
    }

    function applyTheme(id) {
        var t = theme(id);
        var root = document.documentElement.style;
        root.setProperty('--sidebar-bg', t.sidebar);
        root.setProperty('--primary', t.primary);
        root.setProperty('--primary-soft', t.soft);
        root.setProperty('--accent', t.accent);
        root.setProperty('--user-bubble', t.user);
    }

    // ---------- 世界状态 ----------
    function renderWorld() {
        if (!state.world) return;
        var d = state.world.today || '', wd = state.world.weekday || '';
        $('worldDate').textContent = d ? (d.replace(/-/g, '/') + ' · ' + wd) : '—';
        $('worldTime').textContent = state.world.now ? (state.world.now + ' · ' + (state.world.period || '')) : '—';
        $('worldDay').textContent = '世界第 ' + ((state.world.days_elapsed != null ? state.world.days_elapsed : 0) + 1) + ' 天';
        var tags = $('worldTags'); tags.innerHTML = '';
        (state.world.festivals || []).forEach(function (f) {
            var s = document.createElement('span'); s.className = 'tag-mini'; s.textContent = f; tags.appendChild(s);
        });
        // 世界动态: 旁白时间轴 + 每个角色此刻在做什么 + 今天/最近发生的事
        var feed = $('lifeFeed'); feed.innerHTML = '';
        (state.world.events || []).slice().reverse().slice(0, 2).forEach(function (e) {
            var el = document.createElement('div'); el.className = 'life-event nar';
            el.textContent = e.content || '';
            feed.appendChild(el);
        });
        (state.world.npcs || []).forEach(function (n) {
            var line = document.createElement('div'); line.className = 'life-item';
            var nameSpan = document.createElement('span'); nameSpan.textContent = n.name;
            var stSpan = document.createElement('span'); stSpan.className = 'life-status' + (n.busy ? ' busy' : '');
            stSpan.textContent = n.status || '空闲';
            line.appendChild(nameSpan); line.appendChild(stSpan);
            feed.appendChild(line);
            (n.events || []).slice(0, 1).forEach(function (e) {
                var el = document.createElement('div'); el.className = 'life-event';
                var day = (e.date === d) ? '今天' : ((e.date || '').slice(5) || '');
                el.textContent = '↳ ' + (day ? day + ' ' : '') + (e.text || '');
                feed.appendChild(el);
            });
        });
    }
    function loadWorld() {
        api('/world').then(function (data) { state.world = data; renderWorld(); }).catch(function () {});
    }
    function notifyAgent(id) {
        var name = id;
        state.agents.forEach(function (x) { if (x.id === id) name = x.name; });
        api('/agents/' + id + '/inbox').then(function (data) {
            var unread = (data.messages || []).filter(function (m) { return !m.read; });
            if (!unread.length) return;
            var last = unread[unread.length - 1];
            var body = last.content || '';
            if (unread.length > 1) body += '（等 ' + unread.length + ' 条新消息）';
            var n = new Notification(name + ' 发来消息', { body: body, tag: id + '-' + last.id });
            setTimeout(function () { n.close(); }, 6000);
        }).catch(function () {});
    }
    function loadInbox() {
        api('/inbox').then(function (data) {
            var map = {};
            (data.agents || []).forEach(function (a) { map[a.id] = a.unread || 0; });
            var prev = state.unread || {};
            state.unread = map;
            renderSwitcher();
            if (state.notify && window.Notification && Notification.permission === 'granted') {
                Object.keys(map).forEach(function (id) {
                    if (map[id] > (prev[id] || 0)) notifyAgent(id);
                });
            }
        }).catch(function () {});
    }

    // ---------- 角色切换器 ----------
    function renderSwitcher() {
        switcher.innerHTML = '';
        state.agents.forEach(function (a) {
            var v = vis(a.id);
            var item = document.createElement('div');
            item.className = 'cs-item' + (a.id === state.currentId ? ' active' : '');
            item.dataset.id = a.id;

            var img = document.createElement('img');
            img.className = 'cs-avatar'; img.src = v.avatar; img.alt = a.name;
            img.onerror = function () { img.style.display = 'none'; };

            var meta = document.createElement('div'); meta.className = 'cs-meta';
            var name = document.createElement('div'); name.className = 'cs-name'; name.textContent = a.name;
            if (a.status) {
                var st = document.createElement('span'); st.className = 'cs-status' + (a.busy ? ' busy' : '');
                st.textContent = a.status;
                name.appendChild(st);
            }
            var favor = document.createElement('div'); favor.className = 'cs-favor';
            favor.textContent = '好感度 ' + (a.favorability || 0) + ' · ' + (a.stage || favorStage(a.favorability || 0)) + ' · ' + (a.mood || '平静');
            meta.appendChild(name); meta.appendChild(favor);

            item.appendChild(img); item.appendChild(meta);
            var unread = state.unread[a.id] || 0;
            if (unread > 0) {
                var badge = document.createElement('span');
                badge.className = 'unread-badge';
                badge.textContent = unread > 9 ? '9+' : unread;
                item.appendChild(badge);
            }
            item.addEventListener('click', function () { selectAgent(a.id); });
            switcher.appendChild(item);
        });
    }

    // ---------- 角色信息面板 ----------
    function renderPanels() {
        var a = curAgent(); if (!a) return;
        var v = vis(a.id), f = a.favorability || 0;
        $('chatTitle').textContent = '与 ' + a.name + ' 的对话';
        $('chatFavorText').textContent = '好感度 ' + f + ' · ' + (a.stage || favorStage(f)) + ' · 心情 ' + (a.mood || '平静');
        $('chatFavorBar').style.width = f + '%';
        $('bgImg').src = v.card;
        $('cardImg').src = v.card;
        $('cardName').textContent = a.name;
        $('cardEn').textContent = v.en;
        $('cardStatus').textContent = '此刻 · ' + (a.status || '空闲') + (a.activity ? '（' + a.activity + '）' : '')
            + (a.tension_label && a.tension_label !== '正常' ? ' · 对你' + a.tension_label : '');
        $('cardDesc').textContent = a.description || '';
        $('cardQuote').textContent = '“' + (a.quote || v.quote) + '”';
        $('cardFavorValue').textContent = f + ' / 100 · ' + (a.stage || favorStage(f)) + ' · ' + (a.mood || '平静');
        $('cardFavorBar').style.width = f + '%';
        var tags = $('cardTags'); tags.innerHTML = '';
        v.tags.forEach(function (t) {
            var s = document.createElement('span'); s.className = 'tag'; s.textContent = t; tags.appendChild(s);
        });
    }

    // ---------- 回忆日记 ----------
    async function openDiary() {
        var a = curAgent(); if (!a) return;
        diaryModal.classList.add('open');
        $('diaryTitle').textContent = '与 ' + a.name + ' 的回忆';
        $('diarySub').textContent = '每一天，我们都一起经历过什么';
        diaryBody.innerHTML = '<div class="spinner"></div>';
        try {
            var data = await api('/agents/' + a.id + '/diary');
            var diary = data.diary || [];
            diaryBody.innerHTML = '';
            if (diary.length === 0) {
                diaryBody.innerHTML = '<div class="diary-sub">还没有沉淀下来的回忆，多聊聊吧。</div>';
                return;
            }
            diary.slice().reverse().forEach(function (d) {
                var day = document.createElement('div'); day.className = 'diary-day';
                var date = document.createElement('div'); date.className = 'd-date'; date.textContent = d.date;
                var summary = document.createElement('div'); summary.className = 'd-summary'; summary.textContent = d.summary || '';
                day.appendChild(date); day.appendChild(summary);
                var hl = d.highlights || [];
                if (hl.length > 0) {
                    var h = document.createElement('ul'); h.className = 'd-list';
                    hl.forEach(function (x) { var li = document.createElement('li'); li.textContent = '「' + x + '」'; h.appendChild(li); });
                    day.appendChild(h);
                }
                var nd = d.new_understandings || [];
                if (nd.length > 0) {
                    var n = document.createElement('ul'); n.className = 'd-list';
                    nd.forEach(function (x) { var li = document.createElement('li'); li.textContent = '我逐渐了解：' + x; n.appendChild(li); });
                    day.appendChild(n);
                }
                var tg = d.tags || [];
                if (tg.length > 0) {
                    var tagsBox = document.createElement('div'); tagsBox.className = 'diary-tags';
                    tg.forEach(function (t) {
                        var s = document.createElement('span'); s.className = 'diary-tag'; s.textContent = t;
                        tagsBox.appendChild(s);
                    });
                    day.appendChild(tagsBox);
                }
                if (d.favorability !== undefined && d.favorability !== null) {
                    var fv = document.createElement('div'); fv.className = 'diary-favor';
                    fv.textContent = '当天好感度 ' + d.favorability + (d.mood ? ' · 心情 ' + d.mood : '');
                    day.appendChild(fv);
                }
                diaryBody.appendChild(day);
            });
        } catch (e) {
            diaryBody.innerHTML = '<div class="diary-sub">加载失败：' + e.message + '</div>';
        }
    }

    // ---------- 她眼中的你 · 记忆卡 ----------
    async function openMemory() {
        var a = curAgent(); if (!a) return;
        memoryModal.classList.add('open');
        $('memoryTitle').textContent = '她眼中的你';
        $('memorySub').textContent = '在 ' + a.name + ' 心里，你是这样的';
        memoryBody.innerHTML = '<div class="spinner"></div>';
        try {
            var data = await api('/agents/' + a.id + '/memory');
            var chips = [];
            if (data.stage) chips.push({ label: '关系', value: data.stage + ' · ' + (data.favorability || 0) + '/100' });
            if (data.mood) chips.push({ label: '她此刻', value: data.mood });
            if (data.tension_label && data.tension_label !== '正常') chips.push({ label: '她对你的态度', value: data.tension_label });
            var meta = document.createElement('div'); meta.className = 'memory-meta';
            chips.forEach(function (c) {
                var s = document.createElement('span'); s.className = 'chip';
                s.textContent = c.label + ' · ' + c.value; meta.appendChild(s);
            });
            memoryBody.innerHTML = '';
            memoryBody.appendChild(meta);

            var sec1 = document.createElement('div'); sec1.className = 'memory-section';
            var h1 = document.createElement('h4'); h1.textContent = '她对你的印象';
            var p = document.createElement('div'); p.className = 'memory-profile';
            p.textContent = (data.profile && data.profile.trim()) ? data.profile : '她还在慢慢了解你，多聊聊吧。';
            sec1.appendChild(h1); sec1.appendChild(p);
            memoryBody.appendChild(sec1);

            var sec2 = document.createElement('div'); sec2.className = 'memory-section';
            var h2 = document.createElement('h4'); h2.textContent = '她记住的关于你的事';
            var facts = document.createElement('div'); facts.className = 'memory-facts';
            var list = data.facts || [];
            if (list.length === 0) {
                facts.innerHTML = '<div class="diary-sub">还没有沉淀下来的了解，多聊聊吧。</div>';
            } else {
                list.forEach(function (f) {
                    var t = document.createElement('span'); t.className = 'memory-fact'; t.textContent = f;
                    facts.appendChild(t);
                });
            }
            sec2.appendChild(h2); sec2.appendChild(facts);
            memoryBody.appendChild(sec2);
        } catch (e) {
            memoryBody.innerHTML = '<div class="diary-sub">加载失败：' + e.message + '</div>';
        }
    }

    // ---------- 心声 / 反馈 渲染 ----------
    function thoughtBlock(m) {
        if (!state.showThought) return null;
        var hasThought = m.thought;
        var read = m.read || {};
        var hasRead = read.emotion || read.intent || read.topic;
        var hasMood = typeof m.moodShift === 'number' && m.moodShift !== 0;
        if (!hasThought && !hasRead && !hasMood) return null;
        var box = document.createElement('div'); box.className = 'thought-block';
        if (hasThought) {
            var line = document.createElement('div'); line.className = 'thought-line';
            var icon = document.createElement('span'); icon.className = 'thought-icon'; icon.textContent = '💭';
            var txt = document.createElement('span'); txt.className = 'thought-text'; txt.textContent = m.thought;
            line.appendChild(icon); line.appendChild(txt);
            box.appendChild(line);
        }
        if (hasRead) {
            var chips = document.createElement('div'); chips.className = 'read-chips';
            [['察觉', read.emotion], ['意图', read.intent], ['话题', read.topic]].forEach(function (pair) {
                if (!pair[1]) return;
                var c = document.createElement('span'); c.className = 'read-chip';
                c.textContent = pair[0] + ' · ' + pair[1]; chips.appendChild(c);
            });
            box.appendChild(chips);
        }
        if (hasMood) {
            var moodChips = document.createElement('div'); moodChips.className = 'read-chips';
            var c = document.createElement('span'); c.className = 'read-chip mood';
            c.textContent = '心情 ' + (m.moodShift > 0 ? '↑' : '↓') + Math.abs(m.moodShift);
            moodChips.appendChild(c);
            box.appendChild(moodChips);
        }
        return box;
    }

    function feedbackLine(m) {
        var hasDelta = typeof m.favorDelta === 'number' && m.favorDelta !== 0;
        if (!hasDelta && !m.favorReason) return null;
        var d = document.createElement('div');
        d.className = 'feedback-line' + (m.favorDelta < 0 ? ' down' : '');
        var txt = '';
        if (hasDelta) txt += '好感度 ' + (m.favorDelta > 0 ? '+' : '') + m.favorDelta;
        if (m.favorReason) txt += (txt ? ' · ' : '') + m.favorReason;
        d.textContent = txt;
        return d;
    }

    function showToast(text, kind) {
        if (!text) return;
        var t = document.createElement('div');
        t.className = 'toast' + (kind ? ' ' + kind : '');
        t.textContent = text;
        toastWrap.appendChild(t);
        setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 3200);
    }

    function copyText(text) {
        if (!text) return;
        var done = function () { showToast('已复制到剪贴板', ''); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); });
        } else {
            fallbackCopy(text);
        }
    }
    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); showToast('已复制到剪贴板', ''); } catch (e) {}
        document.body.removeChild(ta);
    }

    function applyFavorFeedback(data) {
        var a = curAgent(); if (!a) return;
        if (data.favorability !== undefined) a.favorability = data.favorability;
        if (data.mood !== undefined) a.mood = data.mood;
        if (data.tension_label !== undefined) a.tension_label = data.tension_label;
        renderSwitcher(); renderPanels();
        var txt = '';
        if (data.delta) txt += '好感度 ' + (data.delta > 0 ? '+' : '') + data.delta;
        if (data.reason) txt += (txt ? ' · ' : '') + data.reason;
        if (txt) showToast(txt, data.delta > 0 ? 'up' : (data.delta < 0 ? 'down' : ''));
    }

    function showMilestone(data) {
        showToast('✨ 关系进阶：' + data.from + ' → ' + data.to, 'milestone');
    }

    // ---------- 话题开场卡 ----------
    var TOPIC_TTL = 5 * 60 * 1000;  // 本地话题池有效期(与服务端缓存一致)
    var TOPIC_PAGE = 3;             // 每次展示的话题条数
    function loadTopics(force) {
        if (!state.currentId) return;
        // 本地话题池仍有效时, "换一批"直接轮换, 不发请求
        var poolOk = state.topicAgent === state.currentId && state.topics.length > TOPIC_PAGE;
        var fresh = Date.now() - state.topicLoadedAt <= TOPIC_TTL;
        if (!force && poolOk && fresh) { nextTopics(); return; }
        topicRow.innerHTML = '<div class="spinner" style="margin:4px auto"></div>';
        api('/agents/' + state.currentId + '/topics').then(function (data) {
            var list = data.topics || [];
            // 轻微打乱顺序, 让每次刷新的话题顺序有新鲜感
            for (var i = list.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
            }
            state.topics = list;
            state.topicAgent = state.currentId;
            state.topicIdx = 0;
            state.topicLoadedAt = Date.now();
            renderTopics();
        }).catch(function () { topicRow.innerHTML = ''; });
    }
    function nextTopics() {
        // 全部轮换完或已过期则重新请求, 否则本地轮换一批(即时显示)
        var expired = Date.now() - state.topicLoadedAt > TOPIC_TTL;
        if (expired || state.topics.length <= TOPIC_PAGE) { loadTopics(true); return; }
        // 按整页步进; 超出末尾则回到开头(避免取模在非整页数时产生重叠批次)
        var next = state.topicIdx + TOPIC_PAGE;
        state.topicIdx = next >= state.topics.length ? 0 : next;
        renderTopics();
    }
    function renderTopics() {
        topicRow.innerHTML = '';
        if (!state.topics.length) return;
        state.topics.slice(state.topicIdx, state.topicIdx + TOPIC_PAGE).forEach(function (t) {
            var c = document.createElement('span');
            c.className = 'topic-chip';
            c.textContent = t;
            c.addEventListener('click', function () { input.value = t; input.focus(); updateComposer(); });
            topicRow.appendChild(c);
        });
        var r = document.createElement('button');
        r.className = 'topic-refresh';
        r.textContent = '↻ 换一批';
        r.addEventListener('click', function () { nextTopics(); });
        topicRow.appendChild(r);
    }

    // ---------- 成就 ----------
    function loadAchievements(first) {
        api('/achievements').then(function (data) {
            var list = data.achievements || [];
            state.achievements = list;
            renderAchievements();
            list.forEach(function (a) {
                if (a.unlocked && !state.knownAchievements[a.key]) {
                    state.knownAchievements[a.key] = true;
                    if (!first) showToast(a.emoji + ' 成就解锁：' + a.label, 'milestone');
                }
            });
        }).catch(function () {});
    }
    function renderAchievements() {
        achieveGrid.innerHTML = '';
        state.achievements.forEach(function (a) {
            var item = document.createElement('div');
            item.className = 'achievement-item ' + (a.unlocked ? 'unlocked' : 'locked');
            if (a.unlocked && a.unlocked_at) {
                item.title = '解锁于 ' + new Date(Number(a.unlocked_at) * 1000).toLocaleString();
            }
            var e = document.createElement('div'); e.className = 'a-emoji'; e.textContent = a.unlocked ? a.emoji : '🔒';
            var l = document.createElement('div'); l.className = 'a-label'; l.textContent = a.label;
            var d = document.createElement('div'); d.className = 'a-desc'; d.textContent = a.desc;
            item.appendChild(e); item.appendChild(l); item.appendChild(d);
            achieveGrid.appendChild(item);
        });
    }

    // ---------- 消息渲染 ----------
    function buildBubble(m) {
        var a = curAgent(); var v = vis(a ? a.id : '');
        var row = document.createElement('div');
        row.className = 'message ' + m.role;

        var avatar = document.createElement('div'); avatar.className = 'avatar';
        if (m.role === 'user') {
            avatar.textContent = '我';
            avatar.style.background = 'linear-gradient(135deg,#94a3b8,#64748b)';
            avatar.style.color = '#fff';
        } else if (m.delayed) {
            avatar.textContent = '💤';
            avatar.style.background = 'linear-gradient(135deg,#334155,#1e293b)';
        } else {
            var img = document.createElement('img'); img.src = v.avatar; img.alt = a ? a.name : '';
            img.onerror = function () { avatar.textContent = (a ? a.name : '?').charAt(0); avatar.style.color = '#fff'; avatar.style.background = 'linear-gradient(135deg,var(--primary),var(--accent))'; };
            avatar.appendChild(img);
        }

        var body = document.createElement('div'); body.className = 'message-body';
        if (m.role === 'assistant') {
            var tb = thoughtBlock(m);
            if (tb) body.appendChild(tb);
        }
        var bubble = document.createElement('div');
        bubble.className = 'message-bubble' + (m.delayed ? ' delayed' : '');
        if (m.typing) {
            var dots = document.createElement('span'); dots.className = 'typing';
            dots.innerHTML = '<i></i><i></i><i></i>';
            bubble.appendChild(dots);
        } else {
            bubble.textContent = m.content || '';
        }
        body.appendChild(bubble);
        if (m.role === 'assistant') {
            var fb = feedbackLine(m);
            if (fb) body.appendChild(fb);
        }
        var time = document.createElement('div'); time.className = 'message-time';
        // 优先显示消息真实时间(后端 ts 为秒级时间戳, 需转毫秒); 无 ts(如本地新消息)时兜底当前时间
        var ts = m.ts ? Number(m.ts) * 1000 : Date.now();
        var label = m.delayed ? '延迟回复' : (PROACTIVE_LABELS[m.kind] || (m.proactive ? '主动发来' : ''));
        time.textContent = (label ? label + ' · ' : '') + formatTime(ts);
        body.appendChild(time);

        row.appendChild(avatar); row.appendChild(body);
        if (m.role === 'assistant') {
            var copy = document.createElement('button');
            copy.className = 'copy-btn';
            copy.title = '复制';
            copy.setAttribute('aria-label', '复制');
            copy.innerHTML = '<i class="bi bi-copy"></i>';
            copy.addEventListener('click', function () { copyText(m.content || ''); });
            row.appendChild(copy);
        }
        return row;
    }

    function renderMessages() {
        messagesBox.innerHTML = '';
        var conv = state.conversations[state.currentId];
        var a = curAgent();
        if (!conv || conv.messages.length === 0) {
            var empty = document.createElement('div'); empty.className = 'empty';
            empty.textContent = '和「' + (a ? a.name : '') + '」说点什么吧';
            messagesBox.appendChild(empty);
            return;
        }
        conv.messages.forEach(function (m) { messagesBox.appendChild(buildBubble(m)); });
        scrollToBottom();
    }

    function scrollToBottom() { messagesBox.scrollTop = messagesBox.scrollHeight; }
    function isNearBottom() { return messagesBox.scrollHeight - messagesBox.scrollTop - messagesBox.clientHeight < 80; }
    function maybeScrollToBottom() { if (isNearBottom()) scrollToBottom(); }
    function formatTime(ts) {
        var d = new Date(Number(ts));
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    // ---------- 选择角色 ----------
    async function selectAgent(id) {
        if (state.streaming) return;
        state.currentId = id;
        applyTheme(id);
        renderSwitcher();
        renderPanels();
        if (!state.conversations[id]) state.conversations[id] = { messages: [], loaded: false };
        if (!state.conversations[id].loaded) {
            renderMessages();
            try {
                var data = await api('/agents/' + id + '/history');
                state.conversations[id].messages = data.messages || [];
            } catch (e) { state.conversations[id].messages = []; }
            state.conversations[id].loaded = true;
        }
        // 拉取主动消息: 展示未读的(与历史去重), 然后标记已读
        try {
            var inbox = await api('/agents/' + id + '/inbox');
            var unreadMsgs = (inbox.messages || []).filter(function (m) { return !m.read; });
            if (unreadMsgs.length > 0) {
                var seen = {};
                state.conversations[id].messages.forEach(function (m) {
                    if (m.role === 'assistant' && m.content) seen[m.content] = true;
                });
                unreadMsgs.forEach(function (m) {
                    if (seen[m.content]) return; // 已在历史里出现过, 去重
                    // 带 ts: 收件箱消息有真实发送时间, 让主动消息也显示真实时间
                    state.conversations[id].messages.push({ role: 'assistant', content: m.content, proactive: true, ts: m.ts, kind: m.kind });
                });
                await api('/agents/' + id + '/inbox/read', { method: 'POST' });
                state.unread[id] = 0;
                renderSwitcher();
            }
        } catch (e) {}
        if (state.currentId === id) renderMessages();
        loadTopics();
        loadSchedule(id);
    }

    // ---------- 今日行程 ----------
    function loadSchedule(id) {
        api('/agents/' + id + '/schedule').then(function (data) {
            if (state.currentId !== id) return;  // 竞态防护: 只渲染当前选中角色
            renderSchedule(data.schedule || []);
        }).catch(function () { $('scheduleList').innerHTML = ''; });
    }
    function renderSchedule(list) {
        var box = $('scheduleList'); box.innerHTML = '';
        if (!list.length) { box.innerHTML = '<div class="life-event">暂无行程</div>'; return; }
        list.forEach(function (s) {
            var it = document.createElement('div');
            it.className = 'schedule-item' + (s.current ? ' current' : '');
            var dot = document.createElement('span'); dot.className = 's-dot';
            var time = document.createElement('span'); time.className = 's-time'; time.textContent = s.time;
            var label = document.createElement('span'); label.className = 's-label';
            label.textContent = s.label + (s.activity && s.activity !== s.label ? ' · ' + s.activity : '');
            it.appendChild(dot); it.appendChild(time); it.appendChild(label);
            box.appendChild(it);
        });
    }

    // ---------- 发送 ----------
    function updateComposer() {
        sendBtn.disabled = state.streaming || !input.value.trim();
        input.disabled = state.streaming;
    }
    async function send() {
        var text = input.value.trim();
        if (!text || state.streaming || !state.currentId) return;
        input.value = '';
        var conv = state.conversations[state.currentId];
        conv.messages.push({ role: 'user', content: text });
        var assistantMsg = { role: 'assistant', content: '', typing: true };
        conv.messages.push(assistantMsg);
        state.streaming = true;
        updateComposer();
        renderMessages();
        var assistantRow = messagesBox.lastElementChild;
        var bubbleEl = assistantRow ? assistantRow.querySelector('.message-bubble') : null;

        // 按当前状态重建该条回复的结构(心声 → 气泡 → 反馈 → 时间), 复用已有气泡/时间元素
        function refreshAssistant() {
            if (!assistantRow) return;
            var body = assistantRow.querySelector('.message-body');
            var bubble = assistantRow.querySelector('.message-bubble');
            var time = assistantRow.querySelector('.message-time');
            if (!body || !bubble || !time) return;
            while (body.firstChild) body.removeChild(body.firstChild);
            var tb = thoughtBlock(assistantMsg);
            if (tb) body.appendChild(tb);
            body.appendChild(bubble);
            var fb = feedbackLine(assistantMsg);
            if (fb) body.appendChild(fb);
            body.appendChild(time);
        }

        try {
            var resp = await fetch('/chat', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ agent_id: state.currentId, question: text })
            });
            if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
            var ctype = resp.headers.get('content-type') || '';
            if (ctype.indexOf('text/event-stream') === -1) {
                // 后端对"空问题/未知角色"等返回普通 JSON 错误(非 SSE), 需单独读取并展示
                var errData = await resp.json().catch(function () { return {}; });
                assistantMsg.content = '（' + (errData.error || '出错了') + '）';
                assistantMsg.typing = false;
                renderMessages();
                return;
            }
            var reader = resp.body.getReader(), decoder = new TextDecoder(), buffer = '';
            while (true) {
                var chunk = await reader.read();
                if (chunk.done) break;
                buffer += decoder.decode(chunk.value, { stream: true });
                var lines = buffer.split('\n'); buffer = lines.pop() || '';
                for (var i = 0; i < lines.length; i++) {
                    if (lines[i].indexOf('data: ') !== 0) continue;
                    var data = null;
                    try { data = JSON.parse(lines[i].slice(6)); } catch (e) {}
                    if (!data) continue;
                    if (data.type === 'done') continue;
                    if (data.type === 'cognition') {
                        var d = data.data || {};
                        assistantMsg.thought = d.internal_thought || '';
                        assistantMsg.read = { emotion: d.user_emotion, intent: d.user_intent, topic: d.topic };
                        assistantMsg.moodShift = Number(d.mood_shift) || 0;
                        refreshAssistant();
                        continue;
                    }
                    if (data.type === 'content') {
                        if (assistantMsg.typing) { assistantMsg.typing = false; if (bubbleEl) bubbleEl.textContent = ''; }
                        assistantMsg.content += data.data || '';
                        if (bubbleEl) bubbleEl.textContent = assistantMsg.content;
                        maybeScrollToBottom();
                        continue;
                    }
                    if (data.type === 'sleep') {
                        var sd = data.data || {};
                        // 后端只把用户消息写入历史、回复入队待醒后补回, 不落占位气泡;
                        // 这里移除前端乐观插入的占位气泡, 与后端历史保持一致(刷新后不会多/少一条)
                        var sleepIdx = conv.messages.indexOf(assistantMsg);
                        if (sleepIdx >= 0) conv.messages.splice(sleepIdx, 1);
                        assistantMsg.typing = false;
                        renderMessages();
                        showToast((sd.status || '睡觉中') + ' · 她明早会回复你', 'milestone');
                        continue;
                    }
                    if (data.type === 'favor') {
                        assistantMsg.favorDelta = (data.data || {}).delta || 0;
                        assistantMsg.favorReason = (data.data || {}).reason || '';
                        refreshAssistant();
                        applyFavorFeedback(data.data || {});
                        continue;
                    }
                    if (data.type === 'milestone') {
                        showMilestone(data.data || {});
                        continue;
                    }
                    if (data.type === 'milestone_story') {
                        var ms = data.data || {};
                        showToast('✨ ' + (ms.name ? ms.name + ' · ' : '') + (ms.content || '关系更进一步了'), 'milestone');
                        if (ms.content) conv.messages.push({ role: 'assistant', content: ms.content, proactive: true, kind: 'milestone' });
                        renderMessages();
                        continue;
                    }
                    if (data.type === 'reconcile') {
                        var rc = data.data || {};
                        showToast('💞 ' + (rc.name ? rc.name + ' 和你和好了 · ' : '和好了 · ') + (rc.content || ''), 'milestone');
                        if (rc.content) conv.messages.push({ role: 'assistant', content: rc.content, proactive: true, kind: 'reconcile' });
                        renderMessages();
                        continue;
                    }
                    if (data.type === 'achievement') {
                        var ad = data.data || {};
                        state.knownAchievements[ad.key] = true;
                        showToast(ad.emoji + ' 成就解锁：' + ad.label, 'milestone');
                        continue;
                    }
                    if (data.type === 'error') {
                        assistantMsg.content = assistantMsg.content || ('（' + (data.data || '出错了') + '）');
                        assistantMsg.typing = false;
                        if (bubbleEl) bubbleEl.textContent = assistantMsg.content;
                        continue;
                    }
                }
            }
        } catch (e) {
            assistantMsg.content = assistantMsg.content || ('（发送失败：' + e.message + '）');
            assistantMsg.typing = false;
            if (bubbleEl) bubbleEl.textContent = assistantMsg.content;
        } finally {
            state.streaming = false;
            if (assistantMsg.typing) { assistantMsg.typing = false; renderMessages(); }
            updateComposer();
            maybeScrollToBottom();
            // 好感度可能已变, 刷新角色信息
            refreshAgents();
            loadAchievements(false);
        }
    }

    async function refreshAgents() {
        try {
            var data = await api('/agents');
            state.agents = data.agents || [];
            renderSwitcher();
            renderPanels();
        } catch (e) {}
    }

    input.addEventListener('input', updateComposer);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); send(); } });
    sendBtn.addEventListener('click', send);
    messagesBox.addEventListener('scroll', function () {
        scrollBottomBtn.classList.toggle('show', !isNearBottom());
    });
    scrollBottomBtn.addEventListener('click', function () { scrollToBottom(); });
    $('resetBtn').addEventListener('click', async function () {
        if (!confirm('确定初始化所有角色吗？\n将清空全部对话记录、记忆和好感度，回到最初状态。')) return;
        try {
            await api('/reset?confirm=yes', { method: 'POST' });
            location.reload();
        } catch (e) {
            alert('初始化失败：' + e.message);
        }
    });
    diaryBtn.addEventListener('click', openDiary);
    $('diaryClose').addEventListener('click', function () { diaryModal.classList.remove('open'); });
    diaryModal.addEventListener('click', function (e) { if (e.target === diaryModal) diaryModal.classList.remove('open'); });
    memoryBtn.addEventListener('click', openMemory);
    $('memoryClose').addEventListener('click', function () { memoryModal.classList.remove('open'); });
    memoryModal.addEventListener('click', function (e) { if (e.target === memoryModal) memoryModal.classList.remove('open'); });
    thoughtToggle.addEventListener('click', function () {
        // 流式回复期间禁用切换: renderMessages 会重建 DOM, 使流式缓存的节点脱钩导致正文截断
        if (state.streaming) { showToast('回复进行中，先聊完再切换', ''); return; }
        state.showThought = !state.showThought;
        thoughtToggle.classList.toggle('on', state.showThought);
        renderMessages();
    });
    achieveBtn.addEventListener('click', function () { achieveModal.classList.add('open'); renderAchievements(); });
    $('achieveClose').addEventListener('click', function () { achieveModal.classList.remove('open'); });
    achieveModal.addEventListener('click', function (e) { if (e.target === achieveModal) achieveModal.classList.remove('open'); });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            diaryModal.classList.remove('open');
            memoryModal.classList.remove('open');
            achieveModal.classList.remove('open');
        }
    });
    achieveModal.addEventListener('click', function (e) { if (e.target === achieveModal) achieveModal.classList.remove('open'); });

    // ---------- 昵称 ----------
    function loadNickname() {
        api('/user').then(function (data) { nicknameInput.value = data.nickname || ''; }).catch(function () {});
    }
    nicknameSave.addEventListener('click', function () {
        var name = nicknameInput.value.trim();
        api('/user', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nickname: name }) })
            .then(function (data) { showToast('昵称已保存：' + (data.nickname || '（已清空）'), ''); })
            .catch(function (e) { showToast('保存失败：' + e.message, 'down'); });
    });
    nicknameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') nicknameSave.click(); });

    // ---------- 桌面通知 ----------
    function renderNotifyBtn() { notifyBtn.classList.toggle('on', state.notify); }
    notifyBtn.addEventListener('click', function () {
        if (!('Notification' in window)) { showToast('当前浏览器不支持桌面通知', ''); return; }
        if (Notification.permission === 'granted') {
            state.notify = !state.notify;
            renderNotifyBtn();
            showToast(state.notify ? '桌面通知已开启' : '桌面通知已关闭', '');
        } else {
            Notification.requestPermission().then(function (perm) {
                state.notify = (perm === 'granted');
                renderNotifyBtn();
                showToast(state.notify ? '桌面通知已开启' : '未授权，无法开启', 'down');
            });
        }
    });

    // ---------- 启动 ----------
    async function init() {
        updateComposer();
        try {
            var data = await api('/agents');
            state.agents = data.agents || [];
            if (state.agents.length > 0) await selectAgent(state.agents[0].id);
        } catch (e) {
            $('chatTitle').textContent = '服务未连接';
        }
        loadWorld();
        setInterval(loadWorld, 60 * 1000);
        setInterval(refreshAgents, 15 * 1000);
        loadInbox();
        setInterval(loadInbox, 30 * 1000);
        loadAchievements(true);
        setInterval(function () { loadAchievements(false); }, 30 * 1000);
        loadNickname();
        if (window.Notification && Notification.permission === 'granted') state.notify = true;
        renderNotifyBtn();
    }
    init();
})();
</script>
</body>
</html>
